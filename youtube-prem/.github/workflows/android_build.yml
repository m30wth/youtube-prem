# .github/workflows/android_build.yml

name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Keeping v4 for now, but will check if a newer stable version is available.

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Updated to v5 as recommended
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build APK (Release)
      run: ./gradlew assembleRelease

    - name: Archive APK
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/app-release.apk