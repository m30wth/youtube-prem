name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            youtube-prem/**/*.gradle*
            youtube-prem/**/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        working-directory: ./youtube-prem
        run: chmod +x gradlew

      - name: Build APK (Release)
        working-directory: ./youtube-prem
        run: ./gradlew assembleRelease

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: youtube-prem/app/build/outputs/apk/release/*.apk

